server {
  listen 80;
  server_name _;

  # Carpeta donde Nginx sirve los archivos (la que copias en el Dockerfile)
  root /usr/share/nginx/html;

  # =========================
  # GZIP / COMPRESIÓN
  # =========================
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml;

  # =========================
  # ESTÁTICOS CON CACHÉ LARGA
  # =========================
  location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?|woff|ttf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # =========================
  # HTML / SPA (Angular)
  # =========================
  location / {
    index index.html index.htm;
    # Para que las rutas de Angular funcionen (HTML5 mode)
    try_files $uri $uri/ /index.html =404;
    # No cachear el HTML principal
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
