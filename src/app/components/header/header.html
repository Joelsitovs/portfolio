<header class="fixed top-0 left-0 w-full z-50    bg-slate-900/40 backdrop-blur-2xl   border-b border-slate-800/60">
  <div class="md:fixed md:top-4 md:left-1/2 md:transform md:-translate-x-1/2 w-full md:w-auto">
    <nav
      class="mx-auto max-w-5xl
             bg-slate-900/30
             md:bg-gradient-to-r md:from-slate-900/90 md:via-slate-900/75 md:to-slate-900/90
             md:rounded-2xl px-4 md:px-6 py-2.5
             border border-slate-700/60
             shadow-xl shadow-emerald-500/5
               backdrop-blur-3xl text-slate-100">
      <div class="flex justify-between items-center md:hidden px-2">
        <a class="text-emerald-300 font-bold" href="/" data-discover="true">Portfolio</a>

        <button
          (click)="toggleMobileMenu()"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               class="lucide lucide-text-align-justify-icon lucide-text-align-justify"

          >
            <path d="M3 5h18"/>
            <path d="M3 12h18"/>
            <path d="M3 19h18"/>
          </svg>

        </button>

      </div>
      <div
        class="
         overflow-hidden
         md:overflow-visible
         md:flex md:items-center
         transition-all duration-300 ease-out
         md:max-h-none md:opacity-100 md:translate-y-0"
        [ngClass]="isMobileMenuOpen
    ? 'max-h-64 opacity-100 translate-y-0'
    : 'max-h-0 opacity-0 -translate-y-2'"
      >
        <div class="flex flex-col md:flex-row md:items-center gap-2 text-xs ">
          <a href="Home" (click)="goToHome($event)" class="inline-flex items-center gap-1 px-2 py-1 rounded-md
            hover:bg-white/15 transition whitespace-nowrap  cursor-pointer">
            <i class="pi pi-home
 text-slate-300"></i>
            {{ 'home' | translate }}</a>
          <!--  <a href="#inicio" class="inline-flex items-center gap-1 px-2 py-1 rounded-md
              hover:bg-white/15 transition whitespace-nowrap">
              <i class="pi pi-user text-slate-300"></i>
              {{ 'about' |translate }}</a>-->
          <a
            href="#Skills"
            (click)="goToSkills($event)"
            class="inline-flex items-center gap-1 px-2 py-1 rounded-md
            hover:bg-white/15 transition whitespace-nowrap  cursor-pointer">
            <i class="pi pi-code text-slate-300"></i>
            {{ 'Skills and Tools' | translate }}
          </a>

          <a
            href="#Experience"
            (click)="goToExperience($event)" class="inline-flex items-center gap-1 px-2 py-1 rounded-md
            hover:bg-white/15 transition whitespace-nowrap  cursor-pointer">
            <i class="pi pi-briefcase text-slate-300 cursor-pointer"></i>
            {{ 'experience'| translate }}</a>
          <a href="#inicio" class="inline-flex items-center gap-1 px-2 py-1 rounded-md
            hover:bg-white/15 transition whitespace-nowrap">
            <i class="pi pi-envelope text-slate-300"></i>
            {{ 'contact'| translate }}</a>


          <div class="flex justify-center md:ml-2">
            <div
              class="relative w-[71px] h-7 flex items-center cursor-pointer
                     bg-slate-950/70 rounded-full border border-slate-600/70
                     shadow-inner shadow-slate-900/80
                     overflow-hidden
                     transition-all duration-300 ease-out"
              (click)="toggleLanguage()"
            >
              <!-- PILL -->
              <div
                class="absolute h-[22px] w-8
                       bg-gradient-to-r from-[#7289da] to-[#5645b0]
                       rounded-full shadow-md shadow-indigo-500/30
                       transition-all duration-300 ease-out"
                [ngClass]="currentLang === 'en'
        ? 'left-0.5'
        : 'left-9'"
              ></div>

              <!-- LABELS -->
              <div class="relative w-full flex justify-around items-center">
      <span
        class="z-10 text-[11px] font-semibold transition-colors duration-300"
        [ngClass]="currentLang === 'en'
          ? 'text-slate-50'
          : 'text-slate-400'"
      >
        EN
      </span>

                <span
                  class="z-10 text-[11px] font-semibold transition-colors duration-300"
                  [ngClass]="currentLang === 'es'
          ? 'text-slate-50'
          : 'text-slate-400'"
                >
        ES
      </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>
