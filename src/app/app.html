<app-header/>
<main id="main-content" role="main" class="w-full block ">
  <section id="Home"
           class=" overflow-hidden pt-12 md:pt-18 scroll-mt-20 ">
    @defer (on viewport) {
      <app-home/>

    } @placeholder {
      <section class="min-h-[400px] flex items-center justify-center">
        <p class="text-slate-500 text-sm">Zona de skills (placeholder)…</p>
      </section>
    }
  </section>
  <div class="h-4 w-full"></div>
  <section
    id="Skills"
    class="  overflow-hidden pt-12 md:pt-18 scroll-mt-20 "
  >
    @defer (on viewport) {
      <app-skills/>
    } @placeholder {
      <section class="min-h-[400px] flex items-center justify-center">
        <p class="text-slate-500 text-sm">Zona de skills (placeholder)…</p>
      </section>
    }
  </section>
</main>
