<section class="flex flex-col items-center justify-center py-24 px-6 text-[#d4d4d4]" id="skills">

  <div class="max-w-7xl w-full space-y-12">

    <!-- Title -->
    <div class="text-center space-y-4">
      <h2 class="text-3xl md:text-4xl font-bold text-white tracking-tight"
          [innerHTML]="'SKILLS.TITLE' | translate"></h2>
    </div>

    <!-- Filter Buttons -->
    <div class="flex flex-wrap justify-center gap-2">
      @for (group of filterGroups; track group.key) {
        <button
          (click)="selectGroup(group.key)"
          [class]="selectedGroup() === group.key
            ? 'px-4 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/40 transition-all duration-200'
            : 'px-4 py-1.5 rounded-full text-xs font-semibold bg-white/5 text-zinc-400 border border-white/10 hover:border-white/20 hover:text-zinc-200 transition-all duration-200'">
          {{ 'SKILLS.CATS.' + group.key | translate }}
        </button>
      }
    </div>

    <!-- Skills Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">

      @for (skill of filteredSkills(); track skill.name) {
        <div class="group relative bg-[#0a0a0a]/80 border border-white/5 rounded-xl p-3 flex flex-col items-center justify-center gap-2 transition-all duration-300 hover:border-emerald-500/30 hover:bg-[#0a0a0a] overflow-hidden">

          <div [class]="'absolute inset-0 ' + skill.glow + ' opacity-0 group-hover:opacity-100 transition-opacity duration-500 blur-xl'"></div>

          <div class="relative z-10 p-2 bg-white/5 rounded-lg group-hover:scale-110 transition-transform duration-300">
            @if (skill.type === 'devicon') {
              <i [class]="skill.cls + ' text-3xl'" [style.filter]="skill.iconFilter"></i>
            } @else if (skill.type === 'img') {
              <img [src]="skill.src" [alt]="skill.alt" class="w-7 h-7" [style.filter]="skill.iconFilter"/>
            } @else {
              <span [innerHTML]="skill.svg"></span>
            }
          </div>

          <div class="relative z-10 text-center">
            <h3 class="text-xs font-semibold text-zinc-300 group-hover:text-white transition-colors">{{ skill.name }}</h3>
            <span class="text-[9px] text-zinc-500 uppercase tracking-wider">{{ 'SKILLS.CATS.' + skill.cat | translate }}</span>
          </div>

        </div>
      }

    </div>

    <!-- Load more -->
    @if (hasMore()) {
      <div class="flex justify-center">
        <button
          (click)="showAll.set(true)"
          class="flex items-center gap-2 px-6 py-2 rounded-full text-xs font-semibold bg-white/5 text-zinc-400 border border-white/10 hover:border-emerald-500/30 hover:text-zinc-200 transition-all duration-200">
          {{ 'SKILLS.LOAD_MORE' | translate }}
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
      </div>
    }

  </div>
</section>
